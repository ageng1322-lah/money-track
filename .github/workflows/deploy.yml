name: Deploy Laravel via FTP

on:
  push:
    branches:
      - main # Deployment berjalan otomatis ketika push ke branch main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3

    - name: 🛠️ Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4' # Diperbarui ke 8.4 untuk menyesuaikan versi lokal Anda
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, iconv, json, libxml, pdo

    - name: 📦 Install Composer Dependencies
      run: |
        cd laravel
        composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

    - name: 🚀 Install lftp
      run: sudo apt-get update && sudo apt-get install -y lftp

    - name: 🚀 Sync files via FTP (Fast Parallel)
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        lftp -c "
        open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" ftp://\"$FTP_SERVER\"
        set ftp:ssl-allow no
        mirror -R --verbose --parallel=10 --exclude-glob .git/ --exclude-glob .env --exclude-glob node_modules/ ./laravel/ /
        "
