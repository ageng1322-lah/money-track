name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main  # trigger setiap push ke branch main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Install Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'  # sesuaikan versi Flutter kamu
          channel: 'stable'

      # 3. Masuk ke folder flutter dan install dependencies
      - name: Install dependencies
        run: |
          cd flutter
          flutter pub get

      # 4. Build Flutter Web
      - name: Build Flutter Web
        run: |
          cd flutter
          flutter build web --release --base-href "/money-track/"
          # --base-href penting! Isi dengan nama repo kamu

      # 5. Deploy hasil build ke GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./flutter/build/web  # folder hasil build